name: Bug report
description: Report a reproducible FixLab defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, cookies, or private test data.
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide sanitized commands and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FixLab version
      placeholder: 0.3.0
    validations:
      required: true
