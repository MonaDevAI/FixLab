{
  "version": 1,
  "repository": "MonaDevAI/FixLab",
  "rulesetId": 22968357,
  "targetBranch": "main",
  "maintainerModel": "owner-bypass",
  "requiredStatusChecks": [
    "test",
    "analyze"
  ],
  "pullRequest": {
    "requiredApprovingReviews": 1,
    "dismissStaleApprovals": true,
    "requireCodeOwnerReview": true,
    "requireReviewThreadResolution": true,
    "allowedMergeMethods": [
      "squash"
    ]
  },
  "history": {
    "requireLinearHistory": true,
    "blockDeletion": true,
    "blockForcePush": true
  },
  "bypass": {
    "repositoryRole": "admin",
    "reason": "The repository owner may merge their own validated changes; all non-admin contributors require code-owner approval."
  }
}
