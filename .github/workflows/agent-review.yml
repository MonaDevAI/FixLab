name: Agent Rule Review

on:
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * 3"

permissions:
  contents: read

jobs:
  validate-learned-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate governed learned-rule corpus
        run: npm run agent-rules:check -- --report artifacts/agent-rules.json
      - name: Upload learned-rule report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-rule-report
          path: artifacts/agent-rules.json
          if-no-files-found: error
          retention-days: 30
