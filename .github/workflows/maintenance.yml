name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  actions: write
  contents: read

jobs:
  cleanup-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Delete expired GitHub Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/maintenance/cleanup-github-artifacts.mjs
          --apply
          --older-than-days 30
          --max-items 20
          --report artifacts/cleanup-report.json
      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleanup-report
          path: artifacts/cleanup-report.json
          if-no-files-found: error
          retention-days: 30
