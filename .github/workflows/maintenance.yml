name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  actions: write
  contents: read

jobs:
  cleanup-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Delete expired GitHub Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/maintenance/cleanup-github-artifacts.mjs
          --apply
          --older-than-days 30
          --max-items 20
          --report artifacts/cleanup-report.json
      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleanup-report
          path: artifacts/cleanup-report.json
          if-no-files-found: error
          retention-days: 30
