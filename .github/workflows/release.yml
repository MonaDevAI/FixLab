name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and manifest versions
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packageJson = require("./package.json");
          const plugin = require("./plugin.json");
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (packageJson.version !== tag || plugin.version !== tag) {
            throw new Error(`Tag ${tag}, package ${packageJson.version}, and plugin ${plugin.version} must match.`);
          }
          if (!fs.readFileSync("CHANGELOG.md", "utf8").includes(`## ${tag}`)) {
            throw new Error(`CHANGELOG.md has no ${tag} section.`);
          }
          NODE
      - run: npm run validate
      - run: npm publish --access public --provenance
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
