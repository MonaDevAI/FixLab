name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.validation-signal.outputs.conclusion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run docs:check -- --report artifacts/docs-drift.json
      - run: npm run agent-rules:check -- --report artifacts/agent-rules.json
      - run: npm run policy:check -- --report artifacts/policy.json
      - run: npm run self-healing:verify -- --report artifacts/self-healing-proof.json
      - run: npm run test:ci
      - run: npm run test:e2e
      - run: npm run pack:check
      - name: Emit validation signal
        id: validation-signal
        if: always()
        shell: bash
        run: |
          conclusion="${{ job.status }}"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          printf '{"conclusion":"%s","commit":"%s","runId":"%s"}\n' \
            "$conclusion" \
            "${{ github.sha }}" \
            "${{ github.run_id }}" \
            > artifacts/validation-summary.json
      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FixLab validation"
            echo
            echo "Machine-readable test and documentation reports are attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
